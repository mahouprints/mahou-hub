name: Publicar no Mercado Livre

on:
  workflow_dispatch:
    inputs:
      solicitacao:
        description: 'JSON da inspeção, validação ou publicação; nunca inclua credenciais'
        required: true
        type: string
      certificado_resultado:
        description: 'Certificado público PEM para criptografar o resultado privado'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mahou-api-producao
  cancel-in-progress: false

jobs:
  executar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validar destinatário do resultado
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evento = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          Path('destinatario.pem').write_text(evento['inputs']['certificado_resultado'])
          PY
          openssl x509 -in destinatario.pem -noout -checkend 0

      - name: Configurar SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Conferir versão implantada e executar solicitação
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          REVISAO=$(ssh "$VPS_USER@$VPS_HOST" 'docker inspect --format='"'"'{{ index .Config.Labels "org.opencontainers.image.revision" }}'"'"' mahou-hub-api')
          if [ "$REVISAO" != "$GITHUB_SHA" ]; then
            echo 'A API ainda não executa o commit deste workflow. Aguarde a implantação.'
            exit 1
          fi
          # O repositório é público: nem a solicitação nem o resultado vão para o log.
          python3 -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["inputs"]["solicitacao"])' \
            | ssh "$VPS_USER@$VPS_HOST" \
              'cd /opt/mahou-hub/infra && docker compose --env-file .env.prod --profile prod exec -T api node dist/scripts/mercado-livre-publicar.js' \
              > resultado.json 2>&1

      - name: Criptografar resultado
        if: always()
        run: |
          if [ -f resultado.json ] && [ -f destinatario.pem ]; then
            openssl cms -encrypt -binary -aes-256-cbc -in resultado.json \
              -out resultado.cms -outform DER destinatario.pem
          fi

      - name: Guardar resultado sem credenciais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-mercado-livre
          path: resultado.cms
          if-no-files-found: ignore
          retention-days: 7
